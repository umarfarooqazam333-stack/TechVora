</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="logo" href="./"><img src="assets/images/logo.svg" alt="TechVora logo" class="logo-img"><span class="brand">TechVora</span></a><nav id="main-nav" class="main-nav" role="navigation"><ul><li><a href="./">Home</a></li><li><a href="categories/mobile.html">Mobile</a></li><li><a href="categories/android.html">Android</a></li><li><a href="categories/apps.html">Apps</a></li><li><a href="categories/windows.html">Windows</a></li><li><a href="categories/internet.html">Internet</a></li><li><a href="categories/gadgets.html">Gadgets</a></li><li><a href="categories/how-to.html">How-To</a></li><li><a href="categories/reviews.html">Reviews</a></li><li><a href="categories/comparisons.html">Comparisons</a></li></ul></nav></div></header>
  <main class="container">
    <h1>Contact Us</h1>
    <p>Use the form below to send editorial tips, corrections, or partnership inquiries.</p>
    <form action="#" method="post" aria-label="Contact form">
      <label class="visually-hidden" for="name">Name</label>
      <input id="name" name="name" placeholder="Your name" required>
      <label class="visually-hidden" for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <label class="visually-hidden" for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer container">&copy; 2026 TechVora</footer>
