<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — TechVora</title>
  <meta name="description" content="Contact TechVora for editorial inquiries, tips, or partnerships.">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="logo" href="/"><img src="/assets/images/logo.svg" alt="TechVora logo" class="logo-img"><span class="brand">TechVora</span></a></div></header>
  <main class="container">
    <h1>Contact Us</h1>
    <p>Use the form below to send editorial tips, corrections, or partnership inquiries.</p>
    <form action="#" method="post" aria-label="Contact form">
      <label class="visually-hidden" for="name">Name</label>
      <input id="name" name="name" placeholder="Your name" required>
      <label class="visually-hidden" for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <label class="visually-hidden" for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
  <footer class="site-footer container">&copy; 2026 TechVora</footer>
</body>
</html>
