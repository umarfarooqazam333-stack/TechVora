<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search — TechVora</title>
  <meta name="description" content="Search TechVora articles and categories.">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header"><div class="container header-inner"><a class="logo" href="/"><img src="/assets/images/logo.svg" alt="TechVora logo" class="logo-img"><span class="brand">TechVora</span></a></div></header>
  <main id="main" class="container" tabindex="-1">
    <h1>Search TechVora</h1>
    <p class="muted">Find articles by title, category, or topic. Results update as you type.</p>

    <div role="search" aria-label="Site search">
      <label for="q" class="visually-hidden">Search query</label>
      <input id="q" name="q" type="search" placeholder="Search articles, e.g. 'battery' or 'Android'" autocomplete="off" inputmode="search">
    </div>

    <div id="results" aria-live="polite"></div>
  </main>

  <script src="/assets/js/search.js" defer></script>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
